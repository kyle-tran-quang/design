<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage 01 — Flat card build-up + typewriter reply</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="shared/tokens.css">
<style>
  /* ---------- backdrop: blueprint grid (static for the whole stage) ---------- */
  .grid {
    background-image:
      linear-gradient(to right,  var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to right,  rgba(60,80,120,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(60,80,120,.07) 1px, transparent 1px);
    background-size: var(--grid-minor) var(--grid-minor), var(--grid-minor) var(--grid-minor),
                     calc(var(--grid-minor) * 2) calc(var(--grid-minor) * 2),
                     calc(var(--grid-minor) * 2) calc(var(--grid-minor) * 2);
    /* line through every crosshair centre: 117.6 mod 26.35 = 12.2 ; 117.9 mod 26.35 = 12.5 */
    background-position: 12.2px 12.5px;
  }
  .cross { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .glow {
    /* LIGHTENS the backdrop (+11,+13,+15 RGB), broad vertical lobe left of the card — measured */
    background: radial-gradient(ellipse 300px 640px at 440px 480px, rgba(225,240,255,.55), transparent 72%);
    opacity: 0;
  }

  /* ---------- construction wireframe ---------- */
  .wire { position: absolute; border: 2.5px solid #123c9c; opacity: 0; }
  .wire::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom right, transparent calc(50% - 1.2px), #123c9c 50%, transparent calc(50% + 1.2px)); }

  /* ---------- card: hard-offset multiply slab, NOT a gaussian drop shadow ---------- */
  .card-shadow {
    position: absolute; left: var(--card-x); top: var(--card-y);
    width: var(--card-s); height: var(--card-s);
    background: #929498; mix-blend-mode: multiply; filter: blur(9px); opacity: 0;
  }
  .card {
    position: absolute; left: var(--card-x); top: var(--card-y);
    width: var(--card-s); height: var(--card-s); opacity: 0;
    background: linear-gradient(90deg, var(--card-fill-a) 0, var(--card-fill-a) 45%, var(--card-fill-b) 100%);
  }

  /* ---------- content (positioned in stage coordinates) ---------- */
  .abs { position: absolute; will-change: transform, opacity; opacity: 0; }
  .who { font: 600 22px/26px var(--sans); color: var(--ink); white-space: nowrap; }
  .who span { font-weight: 400; color: var(--ink-2); margin-left: 18px; }
  .who.bot { color: var(--blue-70); }

  .bubble-wrap { left: 688px; top: 297px; width: 615px; height: 118px; }
  .bubble-shadow {
    position: absolute; inset: 0; transform: translate(46px, 20px);
    border-radius: 24px 0 24px 24px; filter: blur(3px);
    background: linear-gradient(90deg, rgba(0,0,0,.14), rgba(0,0,0,.35));
  }
  .bubble {
    position: absolute; inset: 0; background: #fcfcfc; border-radius: 24px 0 24px 24px;
    padding: 19px 46px; font: 400 36px/42px var(--sans); color: var(--ink); white-space: pre;
  }
  .avatar { left: 609px; top: 516px; width: 57px; height: 57px; border-radius: 50%; background: var(--blue); }
  .dots { left: 697px; top: 588px; width: 80px; height: 14px; }
  .dots i { position: absolute; top: 0; width: 12px; height: 12px; border-radius: 50%; background: #525252; opacity: 0; }
  .body { left: 695px; top: 571px; font: 400 35px/41.5px var(--sans); color: var(--ink); white-space: pre; opacity: 1; }
  .body .c { opacity: 0; }
</style>
</head>
<body>
<div id="host">
  <div id="stage">
    <div class="layer grid"></div>
    <div class="layer glow"></div>
    <svg class="cross" viewBox="0 0 1920 1080" aria-hidden="true">
      <defs>
        <pattern id="xh" patternUnits="userSpaceOnUse" x="12.2" y="12.5" width="210.8" height="210.8">
          <path d="M79.9 105.4H130.9M105.4 79.9V130.9" stroke="#767e8c" stroke-width="1.2" fill="none"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#xh)"/>
    </svg>

    <div class="wire" id="wire"></div>
    <div class="card-shadow" id="cardShadow"></div>
    <div class="card" id="card"></div>

    <div class="abs who" id="whoU" style="left:1003px;top:253px;width:302px;text-align:right">Nigel<span>10:45</span></div>
    <div class="abs bubble-wrap" id="bubbleWrap">
      <div class="bubble-shadow"></div>
      <div class="bubble"><span id="bubbleText">I lost my wallet. I need to cancel
my credit card</span></div>
    </div>
    <div class="abs avatar" id="avatar"></div>
    <div class="abs who bot" id="whoA" style="left:695px;top:527px">Cora+<span>10:45</span></div>
    <div class="abs dots" id="dots"><i style="left:0"></i><i style="left:22px"></i><i style="left:44px"></i></div>
    <div class="abs body" id="body"></div>
  </div>
</div>

<script src="shared/stage.js"></script>
<script>
/* Timeline (frames @ 23.976). Part A = clip 01 build-up (0..71). Part B = clip 03 reply, begins at T0.
   Source of every number: references/motion-spec.md §Stage 01 */
const { ease, prog, lerp, $ } = Stage;
const T0 = 96;                       // reply starts here (a beat after the dots land)
const REPLY = "Hi Nigel, we’re sorry you lost your\nwallet and hope all is well otherwise.\n\nCan you confirm your card number is\n12XX XXXX XXXX 4567?";
const FRAMES = T0 + 155;             // typing 70 f + 3.1 s hold, as in the clip
const TYPE_START = T0 + 11, TYPE_LEN = 70;
const CPF = REPLY.length / TYPE_LEN; // chars per frame (≈1.86)

const el = {};
['wire','cardShadow','card','whoU','bubbleWrap','avatar','whoA','dots','body','bubbleText'].forEach(id => el[id] = $('#' + id));
const glow = $('.glow');
const dotEls = Array.from(el.dots.querySelectorAll('i'));
let chars = [];

function rise(node, f, a, b, dy, e = ease.expoOut) {
  const p = prog(f, a, b, e);
  node.style.opacity = p > 0 ? Math.min(1, p * 1.6) : 0;
  node.style.transform = `translateY(${(1 - p) * dy}px)`;
}

function render(f) {
  /* wireframe: grows from bottom-left (536,960), hard-cuts off at f25 */
  const s = 846 * ease.standard(Math.min(1, (f + 4) / 25));
  el.wire.style.cssText = f < 25
    ? `left:536px;top:${960 - s}px;width:${s}px;height:${s}px;opacity:${Math.min(1, (f + 4) / 11)}`
    : 'opacity:0';

  /* card materialises by opacity + shadow growth — never by scale or move.
     Measured card colour: #c3cddc(f24) -> #dae0e5(f28) -> #ececee(f32) -> #f4f4f4(f36) -> #fafafa(f42):
     an ease-out ramp from "backdrop grey" to white over f25..f43 (grid ghosts through it early). */
  const CARD_KF = [[25,[200,209,222]],[28,[218,224,229]],[32,[236,236,238]],[36,[244,244,244]],[42,[250,250,250]],[46,[252,252,252]]];
  const cc = (() => { if (f <= CARD_KF[0][0]) return CARD_KF[0][1];
    for (let i = 1; i < CARD_KF.length; i++) if (f <= CARD_KF[i][0]) { const [fa, ca] = CARD_KF[i-1], [fb, cb] = CARD_KF[i];
      const t = (f - fa) / (fb - fa); return ca.map((v, k) => v + (cb[k] - v) * t); }
    return CARD_KF[CARD_KF.length - 1][1]; })();
  const rgb = (c, k = 1) => `rgb(${c.map(v => Math.round(v * k)).join(',')})`;
  el.card.style.background = `linear-gradient(90deg, ${rgb(cc)} 0, ${rgb(cc)} 45%, ${rgb(cc, .965)} 100%)`;
  el.card.style.opacity = f < 25 ? 0 : (f < 29 ? 0.88 : 1);   // grid ghosts through for ~4 frames
  const sh = prog(f, 25, 40, ease.outCubic);
  el.cardShadow.style.opacity = f < 25 ? 0 : 0.74;
  el.cardShadow.style.transform = `translate(${144 * sh}px, ${55 * sh}px)`;
  glow.style.opacity = prog(f, 21, 36, ease.out);

  /* content rises in, staggered by role (measured: bubble 49..58, text 55.., avatar 59.., label/dots 62..) */
  rise(el.whoU, f, 36, 44, 11, ease.out);
  const decay = (f0, d0) => (f < f0 ? d0 / .68 / .68 : (f - f0 < 14 ? d0 * Math.pow(.68, f - f0) : 0));  // offset in px
  el.bubbleWrap.style.opacity = f >= 47 ? Math.min(1, (f - 46) / 3) : 0;
  el.bubbleWrap.style.transform = `translateY(${decay(49, 91)}px)`;   // f49:91 f50:64 f51:44 f52:31 f53:20 f54:12 f55:7 (measured)
  /* text ink (measured abs. offset from rest): f55:12 f56:7 f57:3 f58:1 px = bubble offset + ~5 px lag */
  el.bubbleText.style.opacity = Math.min(1, Math.max(0, (f - 53) / 3));
  el.bubbleText.style.transform = `translateY(${f < 55 ? 7 : 5 * Math.pow(.55, f - 55)}px)`;
  el.bubbleText.style.display = 'inline-block';
  rise(el.avatar, f, 59, 66, 60);
  rise(el.whoA, f, 62, 69, 20, ease.out);
  el.dots.style.opacity = f >= 62 ? 1 : 0;
  dotEls.forEach((d, i) => {
    const p = prog(f, 62 + i, 71 + i, ease.expoOut);
    d.style.opacity = p > 0 ? 1 : 0;
    d.style.transform = `translateY(${(1 - p) * 21}px)`;
  });

  /* clip 03 reply: dots hold 3 f, fade ~4 f, 5-f beat, constant-rate typewriter */
  if (f >= T0) {
    const fade = 1 - prog(f, T0 + 3, T0 + 7, ease.out);
    dotEls.forEach(d => { d.style.opacity = fade; d.style.transform = 'none'; });
  }
  chars.forEach((c, i) => {
    c.style.opacity = Math.max(0, Math.min(1, (f - TYPE_START - i / CPF) / 1.5));
  });
}

Stage.mount({
  frames: FRAMES,
  render,
  setup() {
    // one span per character → per-character fade without reflow (the whole string is laid out up front)
    for (const ch of REPLY) {
      const s = document.createElement('span');
      s.className = 'c';
      s.textContent = ch;
      el.body.appendChild(s);
      chars.push(s);
    }
  }
});
</script>
</body>
</html>
